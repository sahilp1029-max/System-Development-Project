<!DOCTYPE html>
<html>
<head>
    <title>Safari Kid - Admin Billing</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 40px; background-color: #f4f7f6; }
        .dashboard { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 900px; margin: auto; }
        h1 { color: #1a73e8; border-bottom: 2px solid #1a73e8; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: #5f6368; text-transform: uppercase; font-size: 12px; }
        tr:hover { background-color: #fcfcfc; }
        .price { font-weight: bold; color: #202124; }
        .btn { display: inline-block; padding: 8px 12px; background: #34a853; color: white; text-decoration: none; border-radius: 4px; font-size: 14px; }
        .btn:hover { background: #2d8e47; }
        .back-link { display: block; margin-top: 20px; color: #1a73e8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>Master Billing Ledger</h1>
        <p>Overview of all student balances based on a $15/hr rate.</p>
        
        <table>
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Student ID</th>
                    <th>Total Balance</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for entry in ledger %}
                <tr>
                    <td>{{ entry.name }}</td>
                    <td>{{ entry.id }}</td>
                    <td class="price">${{ entry.total_bill }}</td>
                    <td><a href="/billing/{{ entry.id }}" class="btn">View Breakdown</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        
        <a href="/" class="back-link">← Return to Main Dashboard</a>
    </div>
</body>
</html>
